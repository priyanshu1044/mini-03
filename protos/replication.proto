syntax = "proto3";

package replication;

// The replication service definition.
service ReplicationService {
  // Health check service
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}
  
  // Store a message with replication
  rpc StoreMessage (StoreRequest) returns (StoreResponse) {}
  
  // Retrieve a message from the system
  rpc GetMessage (GetRequest) returns (GetResponse) {}
  
  // Request to steal messages for load balancing
  rpc RequestMessageSteal (StealRequest) returns (StealResponse) {}
  
  // Get system metrics
  rpc GetMetrics (MetricsRequest) returns (MetricsResponse) {}
}

// Heartbeat request to check node health
message HeartbeatRequest {
  string server_id = 1;
  float load_score = 2;
  int32 queue_size = 3;
  float cpu_usage = 4;
  float memory_usage = 5;
}

// Heartbeat response
message HeartbeatResponse {
  bool is_alive = 1;
  string server_id = 2;
  float load_score = 3;
}

// Request to store a message
message StoreRequest {
  string message_id = 1;
  string content = 2;
  repeated string replica_servers = 3; // Optional server IDs to replicate to
}

// Response to a store request
message StoreResponse {
  bool success = 1;
  string message = 2;
  repeated string stored_on = 3; // Server IDs where message was stored
}

// Request to get a message
message GetRequest {
  string message_id = 1;
}

// Response to a get request
message GetResponse {
  bool found = 1;
  string content = 2;
  repeated string replica_locations = 3; // Server IDs where message was found
}

// Message object
message Message {
  string message_id = 1;
  string content = 2;
  repeated string replicas = 3;
  int32 steal_count = 4; // How many times the message has been stolen
}

// Request to steal messages
message StealRequest {
  string requesting_server = 1;
  int32 max_messages = 2;
}

// Response to a steal request
message StealResponse {
  repeated Message stolen_messages = 1;
}

// Request for system metrics
message MetricsRequest {
  // Empty request
}

// Response with system metrics
message MetricsResponse {
  float cpu_percent = 1;
  float memory_percent = 2;
  int32 queue_size = 3;
  float load_score = 4;
}